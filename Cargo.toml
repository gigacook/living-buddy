[workspace]
resolver = "2"
members = ["crates/core", "crates/server"]
# The Tauri shell needs platform GUI SDKs; keep it out of the default workspace so
# core/server builds and tests never depend on them.
exclude = ["apps/native/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
repository = "https://github.com/gigacook/living-buddy"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
regex = "1"
ts-rs = { version = "11", features = ["chrono-impl", "serde-json-impl"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "fs", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
